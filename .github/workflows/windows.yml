name: Native Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare WebView2 on the disposable runner
        shell: pwsh
        run: ./scripts/installer-runtime-ci.ps1
      - name: Race detector
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          gcc --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Win32 resource IDs use pointer values (MAKEINTRESOURCE). Keep
          # races enabled; disable only checkptr in that external ABI adapter.
          go test -race '-gcflags=github.com/lxn/...=-d=checkptr=0' ./... -count=1 -timeout=300s
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test, build and verify one immutable package
        shell: pwsh
        run: ./build.ps1 -Smoke -Package -Installer -SourceCommit $env:GITHUB_SHA
      - name: Verify source and artifact manifest
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Directory ./dist -ExpectedCommit $env:GITHUB_SHA -SourceRoot .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-windows-amd64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/ED Copilot.exe
            dist/ED-Copilot-*-Setup.exe
            dist/ED-Copilot-*-windows-amd64.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/smoke-headless.json
            dist/smoke-native.json
            dist/smoke-stress.json
            dist/smoke-installer.json
            dist/application.cdx.json
            dist/installer.cdx.json
  attest:
    needs: verify
    if: github.repository == 'Naenier/ED-Copilot' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-windows-amd64-${{ github.sha }}
          path: dist
      - name: Verify exact tested bytes before attesting
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Directory ./dist -ExpectedCommit $env:GITHUB_SHA -SourceRoot .
      - name: Attest Windows package and release metadata provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ED Copilot.exe
            dist/ED-Copilot-*-Setup.exe
            dist/ED-Copilot-*-windows-amd64.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
      - name: Attest the application inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ED Copilot.exe
            dist/ED-Copilot-*-windows-amd64.zip
          sbom-path: dist/application.cdx.json
      - name: Attest the installer inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ED-Copilot-*-Setup.exe
          sbom-path: dist/installer.cdx.json
  release:
    needs: attest
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-windows-amd64-${{ github.sha }}
          path: dist
      - name: Publish the exact verified artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -Directory ./dist -ExpectedCommit $env:GITHUB_SHA -SourceRoot .

name: Native Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare WebView2 on the disposable runner
        shell: pwsh
        run: ./scripts/installer-runtime-ci.ps1
      - name: Frontend contract tests
        shell: pwsh
        run: |
          $frontendTests = @(Get-ChildItem -LiteralPath 'internal/frontend' -Filter '*.test.cjs' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($frontendTests.Count -eq 0) { throw 'Frontend tests were not found.' }
          node --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test @frontendTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Tests and static checks
        shell: pwsh
        run: |
          go mod verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test ./... -count=1 -timeout=120s -coverprofile=coverage.out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Race detector
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          gcc --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The Win32 dependencies encode resource IDs as pointer values
          # (MAKEINTRESOURCE). Keep the race detector enabled everywhere;
          # suppress only checkptr in that external ABI adapter.
          go test -race '-gcflags=github.com/lxn/...=-d=checkptr=0' ./... -count=1 -timeout=180s
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and isolated smoke
        shell: pwsh
        run: ./build.ps1 -SkipTests -Smoke -Package -Installer
  release:
    needs: verify
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare WebView2 on the disposable runner
        shell: pwsh
        run: ./scripts/installer-runtime-ci.ps1
      - name: Package
        shell: pwsh
        run: ./build.ps1 -SkipTests -Smoke -Package -Installer
      - name: Publish v2.6.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.6.0 'dist/ED-Copilot-2.6.0-windows-amd64.zip' 'dist/ED-Copilot-2.6.0-Setup.exe' 'dist/SHA256SUMS.txt' 'dist/smoke-headless.json' 'dist/smoke-native.json' 'dist/smoke-stress.json' 'dist/smoke-installer.json' --target $env:GITHUB_SHA --title 'ED Copilot 2.6.0' --notes-file docs/RELEASE-2.6.0.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

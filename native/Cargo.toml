[package]
name = "edexo-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "EDEXO foreground-window helper used by ED Copilot overlays"
license-file = "../LICENSE"

# No external Rust crates are used.
[dependencies]

[[bin]]
name = "edexo-fgwatch"
path = "src/fgwatch.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
